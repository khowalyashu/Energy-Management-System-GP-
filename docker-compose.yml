version: "3.9"

services:
  mongodb:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ems-app:
    build: .
    container_name: ems-app
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/myems
    depends_on:
      - mongodb

volumes:
  mongo-data:
